[project]
name = "sample"
version = "0.1.0"
description = "Sample application"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "beanie>=1.29.0",
    "fastapi-pagination>=0.12.34",
    "fastapi[all]>=0.109.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.7.1",
    "pynvml>=12.0.0",
    "python-json-logger>=3.2.1",
    "utilities",
    "fastapi-problem>=0.10.6",
    "sqlmodel>=0.0.24",
    "pyjwt>=2.10.1",
    "apscheduler>=3.11.0",
    "motor>=3.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample"]

[dependency-groups]
dev = []

[tool.uv.sources]
utilities = { workspace = true }
