cache-dir = "~/.cache/ruff"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 132
indent-width = 4
target-version = "py313"

[lint]
select = [
    "A",
    "FAST",
    "C90",
    "S",
    "E",
    "F",
    "I",
    "W",
    "N",
    "Q",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "DTZ",
    "EM",
    "EXE",
    "FIX",
    "INT",
    "ISC",
    "PIE",
    "T20",
    "PT",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "FLY",
    "NPY",
    "PERF",
    "PL",
    "FURB",
    "RUF",
    "TRY",

]


per-file-ignores = { "**/tests/*" = [
    "S101",
    "PLR2004",
], "**/notebooks/*" = [
    "T201",
] }
ignore = ["E501", "B008", "UP046", "UP047"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
